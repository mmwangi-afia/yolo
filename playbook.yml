---
##adding main ansible playbook with roles and tags
- name: Deploy YOLO E-commerce Application
  hosts: vagrant_vm
  become: yes
  
  vars_files:
    - group_vars/all.yml
  
  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      ignore_errors: yes
      tags: always
    
    - name: Install system packages
      apt:
        name:
          - git
          - curl
          - python3-pip
          - apt-transport-https
          - python3-docker
        state: present
        update_cache: yes
      tags: setup
    
    - name: Create application group
      group:
        name: "{{ app_group }}"
        state: present
      tags: setup
    
    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        create_home: yes
        shell: /bin/bash
        state: present
      tags: setup
    
    - name: Create project directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ project_root }}"
        - "{{ mongodb_data_dir }}"
      tags: setup
  
  roles:
    - { role: geerlingguy.docker, tags: [docker, setup] }
    - { role: clone_repo, tags: [clone, setup] }
    - { role: mongodb, tags: [mongodb, containers] }
    - { role: backend, tags: [backend, containers] }
    - { role: frontend, tags: [frontend, containers] }
  
  post_tasks:
    - name: Display deployment info
      debug:
        msg:
          - "Deployment Complete!"
          - "Frontend: http://{{ ansible_host }}:{{ frontend_port }}"
          - "Backend: http://{{ ansible_host }}:{{ backend_port }}/api/products"
          - "MongoDB: mongodb://{{ ansible_host }}:{{ mongodb_port }}"
      tags: always