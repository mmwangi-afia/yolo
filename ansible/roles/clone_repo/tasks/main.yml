---
- name: Clone YOLO Application from GitHub
  block:
    - name: Clone application repository
      git:
        repo: "{{ github_repo }}"
        dest: "{{ project_root }}"
        version: "{{ github_branch }}"
        force: yes
      become_user: "{{ app_user }}"
    
    - name: Set ownership of cloned files
      file:
        path: "{{ project_root }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        recurse: yes
    
    - name: Display clone status
      debug:
        msg: "Repository cloned successfully to {{ project_root }}"
  
  rescue:
    - name: Display clone error
      debug:
        msg: "Failed to clone repository from {{ github_repo }}"
    
    - name: Fail the playbook
      fail:
        msg: "Repository cloning failed"
  
  tags:
    - clone
    - setup